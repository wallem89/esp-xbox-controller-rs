[package]
name = "esp32-c3-tasks-example"
description = "Task and channel based Xbox controller demo for the XIAO ESP32-C3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
embassy-executor = "0.10"
embassy-sync = "0.8"
embassy-time = "0.5.1"
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.20.0", features = [
    "esp32c3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-hal = { version = "1.2.1", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
# TODO: Update esp-radio to released version when compatible with esp-hal 1.2.1
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "dbd951f78c1276461ea3050c2ba71f552a3508ef", features = [
    "esp32c3",
    "ble",
    "esp-alloc",
    "unstable",
] }
esp-rtos = { version = "0.4.0", features = [
    "esp32c3",
    "embassy",
    "esp-radio",
    "esp-alloc",
] }
trouble-host = { git = "https://github.com/embassy-rs/trouble", rev = "290ab2f45392998fa80a098f853ec86ebaa7c99c", features = [
    "default-packet-pool-mtu-255",
    "legacy-pairing",
    "log",
    "scan",
    "security",
] }
esp-xbox-controller = { path = "../..", features = ["esp32c3"] }
