name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test -p xbox-controller-core --all-features

      - name: Run Clippy
        run: cargo clippy -p xbox-controller-core --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p xbox-controller-core --all-features --no-deps

      - name: Verify crates.io package
        run: cargo package -p xbox-controller-core

  inspector:
    name: Ubuntu controller inspector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libudev-dev libxkbcommon-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check inspector
        run: cargo check -p xbox-controller-inspector --all-targets

      - name: Test inspector
        run: cargo test -p xbox-controller-inspector --all-targets

      - name: Run inspector Clippy
        run: cargo clippy -p xbox-controller-inspector --all-targets -- -D warnings

  esp32-c3-example:
    name: ESP32-C3 example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust and RISC-V target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Build and link embedded example
        working-directory: examples/esp32-c3-example
        run: cargo build --release
