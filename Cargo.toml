[workspace]
resolver = "2"
members = [".", "examples/esp32-c3-example", "tools/xbox-controller-inspector"]
default-members = [".", "tools/xbox-controller-inspector"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96.0"
repository = "https://github.com/wallem89/esp-xbox-controller-rs"

[package]
name = "esp-xbox-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

description = "Xbox controller BLE library for ESP32, with a reusable no_std report parser"
homepage = "https://github.com/wallem89/esp-xbox-controller-rs"
documentation = "https://docs.rs/esp-xbox-controller"
readme = "README.md"


keywords = ["xbox", "gamepad", "hid", "ble", "no-std"]
categories = ["embedded", "no-std", "parser-implementations"]

include = [
    "src/**",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
]

[features]
default = []
esp32-c3 = [
    "dep:bt-hci",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:esp-hal",
    "dep:esp-println",
    "dep:trouble-host",
]

[dependencies]
bt-hci = { version = "0.8", optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-time = { version = "0.5", optional = true }
esp-hal = { version = "1.1", features = ["esp32c3", "unstable"], optional = true }
esp-println = { version = "0.17", features = ["esp32c3", "log-04"], optional = true }
trouble-host = { git = "https://github.com/embassy-rs/trouble", rev = "fad811b", features = [
    "default-packet-pool-mtu-255",
    "legacy-pairing",
    "log",
    "scan",
    "security",
], optional = true }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
